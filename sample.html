<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sample Page</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #222; }
    h1 { color: #1d3557; }
    a { color: #1976d2; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 8px; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>Welcome to my page</h1>
  <p>This is a paragraph of text that you can edit. Try hovering over different elements.</p>

  <div class="card">
    <h2>About</h2>
    <p>Visit <a href="https://example.com">example.com</a> for more information.</p>
  </div>

  <div class="card">
    <h2>Photo</h2>
    <img src="https://placehold.co/600x300/1d3557/ffffff?text=Edit+Me" alt="Placeholder image" />
    <p>An image with placeholder content. Click it to change the URL or alt text.</p>
  </div>

  <footer>
    <p>Made with <a href="https://example.com/footer">a link in the footer</a>.</p>
  </footer>
</body>
</html>
